<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040914">
  <title>霓虹航线 · NEON ROUTE</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040914;color:#e8f4ff;font-family:monospace,sans-serif}
    body{background:#10152c}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#497088 1px,transparent 1px);background-size:73px 79px;opacity:.22}
    #frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    canvas{display:block;height:100%;max-width:100%;aspect-ratio:9/16;background:#040914;touch-action:none;outline:none;image-rendering:pixelated;box-shadow:0 0 0 4px #354261}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050c19;z-index:2}
    .card{width:min(72vw,288px);text-align:center}
    .track{height:24px;padding:4px;background:#101e30;border:4px solid #354b63;box-shadow:4px 0 #182b40,-4px 0 #182b40,0 4px #182b40,0 -4px #182b40;overflow:hidden}
    #bar{height:100%;width:0;background:repeating-linear-gradient(to right,#59edf0 0,#59edf0 8px,transparent 8px,transparent 12px)}
    #status{display:none;color:#8198ae;font-size:12px;margin:20px 0 0}#retry{background:#59edf0;border:0;color:#061520;padding:12px 24px;cursor:pointer;display:none;margin:16px auto 0;font-family:inherit}
  </style>
</head>
<body>
  <div id="frame"><canvas id="unity-canvas" tabindex="0" aria-label="霓虹航线游戏"></canvas></div>
  <div id="loading"><div class="card"><div class="track" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div><p id="status" role="alert"></p><button id="retry" onclick="location.reload()">重试</button></div></div>
  <script>
    const canvas=document.getElementById('unity-canvas');
    let instance;
    function fit(){const f=document.getElementById('frame'),s=getComputedStyle(f);const h=f.clientHeight-parseFloat(s.paddingTop)-parseFloat(s.paddingBottom),w=f.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight);const height=Math.min(h,w*16/9);canvas.style.height=height+'px';canvas.style.width=height*9/16+'px';}
    fit();window.addEventListener('resize',fit);
    canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    canvas.addEventListener('pointerdown',()=>canvas.focus());
    window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();});
    function fail(message){document.getElementById('loading').style.display='flex';document.getElementById('status').textContent=message;document.getElementById('status').style.display='block';document.getElementById('retry').style.display='block';}
    const script=document.createElement('script');script.src='Build/WebGameTest.loader.js';
    script.onerror=()=>fail('加载失败，请检查网络后重试。');
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:'Build/WebGameTest.data.unityweb',frameworkUrl:'Build/WebGameTest.framework.js.unityweb',codeUrl:'Build/WebGameTest.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',
      companyName:'NeonRoute',productName:'霓虹航线',productVersion:'1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
      showBanner:(message,type)=>{if(type==='error')fail('运行遇到问题，请刷新页面或使用新版浏览器。');console[type==='error'?'error':'warn'](message);}
    },progress=>{const percent=Math.max(0,Math.min(100,Math.round(progress*100)));document.getElementById('bar').style.width=percent+'%';document.querySelector('.track').setAttribute('aria-valuenow',percent);})
    .then(value=>{instance=value;document.getElementById('loading').style.display='none';canvas.focus();})
    .catch(error=>{console.error(error);fail('无法启动，请使用支持 WebGL 2 的新版浏览器并重试。');});
    document.body.appendChild(script);
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&instance)instance.SendMessage('NeonRoute','BrowserHidden','');});
    window.addEventListener('blur',()=>{if(instance)instance.SendMessage('NeonRoute','BrowserHidden','');});
  </script>
</body>
</html>
